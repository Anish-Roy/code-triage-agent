[project]
name = "code-triage-agent"
version = "0.1.0"
description = "CI failure triage agent with a self-improving background loop"
readme = "README.md"
authors = [
    { name = "Anish-Roy", email = "codingspree101@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
code-triage-agent = "code_triage_agent.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [".venv", "var"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "B008", # FastAPI/pydantic commonly use calls in defaults
]

[tool.ruff.lint.isort]
known-first-party = ["code_triage_agent"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
packages = ["code_triage_agent"]
strict = true
disallow_untyped_decorators = false
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
