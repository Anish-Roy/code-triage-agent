name: Eval nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay-frozen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      # The frozen set ships recorded/cached turns, so this job never needs a
      # provider secret. If a live run is added later, gate it on a repository
      # secret and keep the scripted nightly as the deterministic floor.
      - name: Replay the full frozen set
        run: >
          uv run code-triage-agent eval run
          --set frozen
          --baseline evals/baselines/frozen.json
          --report-dir evals/reports
          --json

      - name: Upload replay report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-nightly-report
          path: evals/reports/
          if-no-files-found: warn
